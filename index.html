<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Keyword Detector | Voice Command Recognition</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-primary: #0f0f1a;
      --bg-secondary: #1a1a2e;
      --bg-card: rgba(30, 30, 50, 0.8);
      --accent-primary: #6366f1;
      --accent-secondary: #8b5cf6;
      --accent-success: #10b981;
      --accent-danger: #ef4444;
      --accent-warning: #f59e0b;
      --text-primary: #f8fafc;
      --text-secondary: #94a3b8;
      --text-muted: #64748b;
      --border-color: rgba(255, 255, 255, 0.1);
      --glow-primary: rgba(99, 102, 241, 0.4);
      --glow-success: rgba(16, 185, 129, 0.4);
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      background: var(--bg-primary);
      color: var(--text-primary);
      min-height: 100vh;
      overflow-x: hidden;
    }

    /* Animated Background */
    .bg-animation {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: -1;
      background: 
        radial-gradient(ellipse at 20% 20%, rgba(99, 102, 241, 0.15) 0%, transparent 50%),
        radial-gradient(ellipse at 80% 80%, rgba(139, 92, 246, 0.15) 0%, transparent 50%),
        radial-gradient(ellipse at 50% 50%, rgba(16, 185, 129, 0.05) 0%, transparent 70%);
    }

    .container {
      max-width: 800px;
      margin: 0 auto;
      padding: 2rem;
    }

    /* Header */
    header {
      text-align: center;
      margin-bottom: 3rem;
      padding-top: 2rem;
    }

    .logo {
      display: inline-flex;
      align-items: center;
      gap: 0.75rem;
      margin-bottom: 1rem;
    }

    .logo-icon {
      width: 48px;
      height: 48px;
      background: linear-gradient(135deg, var(--accent-primary), var(--accent-secondary));
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.5rem;
      box-shadow: 0 4px 20px var(--glow-primary);
    }

    h1 {
      font-size: 2.5rem;
      font-weight: 700;
      background: linear-gradient(135deg, var(--text-primary), var(--accent-primary));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .subtitle {
      color: var(--text-secondary);
      font-size: 1.1rem;
      margin-top: 0.5rem;
    }

    /* Main Control Card */
    .control-card {
      background: var(--bg-card);
      backdrop-filter: blur(20px);
      border: 1px solid var(--border-color);
      border-radius: 24px;
      padding: 2rem;
      margin-bottom: 2rem;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
    }

    /* Status Indicator */
    .status-section {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 1rem;
      margin-bottom: 2rem;
    }

    .status-dot {
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background: var(--text-muted);
      transition: all 0.3s ease;
    }

    .status-dot.listening {
      background: var(--accent-success);
      box-shadow: 0 0 20px var(--glow-success);
      animation: pulse 1.5s infinite;
    }

    .status-dot.verified {
      background: var(--accent-success);
    }

    .status-dot.unverified {
      background: var(--accent-warning);
    }

    @keyframes pulse {
      0%, 100% { transform: scale(1); opacity: 1; }
      50% { transform: scale(1.2); opacity: 0.7; }
    }

    .status-text {
      font-size: 1.1rem;
      font-weight: 500;
      color: var(--text-secondary);
    }

    /* Main Button */
    .btn-main {
      width: 100%;
      padding: 1.25rem 2rem;
      font-size: 1.1rem;
      font-weight: 600;
      border: none;
      border-radius: 16px;
      cursor: pointer;
      transition: all 0.3s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.75rem;
    }

    .btn-start {
      background: linear-gradient(135deg, var(--accent-primary), var(--accent-secondary));
      color: white;
      box-shadow: 0 4px 20px var(--glow-primary);
    }

    .btn-start:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 30px var(--glow-primary);
    }

    .btn-stop {
      background: linear-gradient(135deg, var(--accent-danger), #dc2626);
      color: white;
      box-shadow: 0 4px 20px rgba(239, 68, 68, 0.4);
    }

    .btn-stop:hover {
      transform: translateY(-2px);
    }

    .btn-disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    /* Speaker Verification */
    .verification-section {
      margin-top: 1.5rem;
      padding: 1rem;
      background: rgba(255, 255, 255, 0.03);
      border-radius: 12px;
    }

    .verification-label {
      font-size: 0.85rem;
      color: var(--text-muted);
      margin-bottom: 0.5rem;
    }

    .verification-bar {
      height: 8px;
      background: rgba(255, 255, 255, 0.1);
      border-radius: 4px;
      overflow: hidden;
    }

    .verification-fill {
      height: 100%;
      background: linear-gradient(90deg, var(--accent-danger), var(--accent-warning), var(--accent-success));
      border-radius: 4px;
      transition: width 0.3s ease;
    }

    .verification-value {
      display: flex;
      justify-content: space-between;
      margin-top: 0.5rem;
      font-size: 0.85rem;
    }

    /* Live Transcript */
    .transcript-card {
      background: var(--bg-card);
      backdrop-filter: blur(20px);
      border: 1px solid var(--border-color);
      border-radius: 24px;
      padding: 1.5rem;
      margin-bottom: 2rem;
    }

    .card-header {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      margin-bottom: 1rem;
      padding-bottom: 1rem;
      border-bottom: 1px solid var(--border-color);
    }

    .card-icon {
      width: 36px;
      height: 36px;
      background: rgba(99, 102, 241, 0.2);
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .card-title {
      font-size: 1rem;
      font-weight: 600;
    }

    .partial-text {
      color: var(--text-muted);
      font-style: italic;
      min-height: 1.5rem;
      font-size: 1.1rem;
    }

    .transcript-list {
      max-height: 150px;
      overflow-y: auto;
      margin-top: 1rem;
    }

    .transcript-item {
      padding: 0.5rem 0;
      border-bottom: 1px solid rgba(255, 255, 255, 0.05);
      color: var(--text-secondary);
    }

    /* Keywords Section */
    .keywords-section {
      background: var(--bg-card);
      backdrop-filter: blur(20px);
      border: 1px solid var(--border-color);
      border-radius: 24px;
      padding: 1.5rem;
    }

    .keywords-grid {
      display: flex;
      flex-wrap: wrap;
      gap: 0.75rem;
      margin-top: 1rem;
    }

    .keyword-chip {
      padding: 0.5rem 1rem;
      background: rgba(99, 102, 241, 0.15);
      border: 1px solid rgba(99, 102, 241, 0.3);
      border-radius: 20px;
      font-size: 0.9rem;
      color: var(--text-secondary);
      transition: all 0.3s ease;
    }

    .keyword-chip.available {
      opacity: 0.5;
    }

    .keyword-chip.detected {
      background: linear-gradient(135deg, var(--accent-primary), var(--accent-secondary));
      border-color: transparent;
      color: white;
      box-shadow: 0 4px 15px var(--glow-primary);
      animation: keywordPop 0.3s ease;
    }

    @keyframes keywordPop {
      0% { transform: scale(1); }
      50% { transform: scale(1.1); }
      100% { transform: scale(1); }
    }

    /* Last Detected Keyword */
    .last-keyword {
      text-align: center;
      padding: 1.5rem;
      background: linear-gradient(135deg, rgba(99, 102, 241, 0.1), rgba(139, 92, 246, 0.1));
      border-radius: 16px;
      margin-top: 1rem;
    }

    .last-keyword-label {
      font-size: 0.85rem;
      color: var(--text-muted);
      margin-bottom: 0.5rem;
    }

    .last-keyword-value {
      font-size: 2rem;
      font-weight: 700;
      background: linear-gradient(135deg, var(--accent-primary), var(--accent-secondary));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    /* Footer */
    footer {
      text-align: center;
      padding: 2rem;
      color: var(--text-muted);
      font-size: 0.85rem;
    }

    footer a {
      color: var(--accent-primary);
      text-decoration: none;
    }

    /* Responsive */
    @media (max-width: 640px) {
      .container {
        padding: 1rem;
      }
      
      h1 {
        font-size: 1.75rem;
      }
      
      .control-card, .transcript-card, .keywords-section {
        padding: 1.25rem;
        border-radius: 16px;
      }
    }

    /* Scrollbar */
    ::-webkit-scrollbar {
      width: 6px;
    }

    ::-webkit-scrollbar-track {
      background: rgba(255, 255, 255, 0.05);
      border-radius: 3px;
    }

    ::-webkit-scrollbar-thumb {
      background: rgba(255, 255, 255, 0.2);
      border-radius: 3px;
    }
  </style>
</head>
<body>
  <div class="bg-animation"></div>
  
  <div class="container">
    <header>
      <div class="logo">
        <div class="logo-icon">🎙️</div>
        <h1>Keyword Detector</h1>
      </div>
      <p class="subtitle">Speaker-verified voice command recognition</p>
    </header>

    <!-- Main Control -->
    <div class="control-card">
      <div class="status-section">
        <div class="status-dot" id="statusDot"></div>
        <span class="status-text" id="statusText">Ready to listen</span>
      </div>

      <button class="btn-main btn-start" id="mainBtn" onclick="toggleListening()">
        <span id="btnIcon">▶️</span>
        <span id="btnText">Start Listening</span>
      </button>

      <div class="verification-section">
        <div class="verification-label">Speaker Verification</div>
        <div class="verification-bar">
          <div class="verification-fill" id="verificationFill" style="width: 0%"></div>
        </div>
        <div class="verification-value">
          <span id="verificationStatus">Not verified</span>
          <span id="similarityValue">0%</span>
        </div>
      </div>
    </div>

    <!-- Live Transcript -->
    <div class="transcript-card">
      <div class="card-header">
        <div class="card-icon">💬</div>
        <span class="card-title">Live Transcript</span>
      </div>
      <div class="partial-text" id="partialText">Waiting for speech...</div>
      <div class="transcript-list" id="transcriptList"></div>
    </div>

    <!-- Keywords -->
    <div class="keywords-section">
      <div class="card-header">
        <div class="card-icon">🔑</div>
        <span class="card-title">Keywords</span>
      </div>
      
      <div class="keywords-grid" id="keywordsGrid"></div>

      <div class="last-keyword" id="lastKeywordSection" style="display: none;">
        <div class="last-keyword-label">Last Detected</div>
        <div class="last-keyword-value" id="lastKeywordValue">-</div>
      </div>
    </div>

    <footer>
      Made with ❤️ for voice-controlled applications
    </footer>
  </div>

  <script>
    const API_BASE = window.location.origin;
    let isListening = false;
    let statusInterval = null;
    let allKeywords = [];

    // Initialize
    document.addEventListener('DOMContentLoaded', async () => {
      try {
        const response = await fetch(`${API_BASE}/info`);
        const data = await response.json();
        allKeywords = data.keywords || [];
        renderKeywords([]);
      } catch (err) {
        console.error('Failed to load keywords:', err);
        allKeywords = ['yes', 'no', 'left', 'right', 'up', 'down', 'next', 'cancel', 'back', 'start', 'stop', 'exit'];
        renderKeywords([]);
      }
    });

    function renderKeywords(detected) {
      const grid = document.getElementById('keywordsGrid');
      grid.innerHTML = allKeywords.map(kw => `
        <span class="keyword-chip ${detected.includes(kw) ? 'detected' : 'available'}">${kw}</span>
      `).join('');
    }

    async function toggleListening() {
      if (isListening) {
        await stopListening();
      } else {
        await startListening();
      }
    }

    async function startListening() {
      try {
        const response = await fetch(`${API_BASE}/start`);
        const data = await response.json();
        
        if (data.status === 'listening' || data.status === 'already_listening') {
          isListening = true;
          updateUI(true);
          startPolling();
        }
      } catch (err) {
        console.error('Failed to start:', err);
        alert('Failed to start listening. Is the server running?');
      }
    }

    async function stopListening() {
      try {
        stopPolling();
        const response = await fetch(`${API_BASE}/stop`);
        const data = await response.json();
        
        isListening = false;
        updateUI(false);
        
        // Show final results
        if (data.keywords && data.keywords.length > 0) {
          renderKeywords(data.keywords);
        }
      } catch (err) {
        console.error('Failed to stop:', err);
      }
    }

    function updateUI(listening) {
      const btn = document.getElementById('mainBtn');
      const btnIcon = document.getElementById('btnIcon');
      const btnText = document.getElementById('btnText');
      const statusDot = document.getElementById('statusDot');
      const statusText = document.getElementById('statusText');

      if (listening) {
        btn.className = 'btn-main btn-stop';
        btnIcon.textContent = '⏹️';
        btnText.textContent = 'Stop Listening';
        statusDot.className = 'status-dot listening';
        statusText.textContent = 'Listening...';
      } else {
        btn.className = 'btn-main btn-start';
        btnIcon.textContent = '▶️';
        btnText.textContent = 'Start Listening';
        statusDot.className = 'status-dot';
        statusText.textContent = 'Ready to listen';
      }
    }

    function startPolling() {
      statusInterval = setInterval(pollStatus, 300);
    }

    function stopPolling() {
      if (statusInterval) {
        clearInterval(statusInterval);
        statusInterval = null;
      }
    }

    async function pollStatus() {
      try {
        const response = await fetch(`${API_BASE}/status`);
        const data = await response.json();

        // Update listening state
        if (!data.listening && isListening) {
          isListening = false;
          updateUI(false);
          stopPolling();
        }

        // Update partial text
        const partialEl = document.getElementById('partialText');
        if (data.partial) {
          partialEl.textContent = `"${data.partial}..."`;
          partialEl.style.color = '';
        } else if (data.transcript && data.transcript.length > 0) {
          partialEl.textContent = `Last: "${data.transcript[data.transcript.length - 1]}"`;
        } else {
          partialEl.textContent = 'Listening for speech...';
        }

        // Update transcript list
        const transcriptList = document.getElementById('transcriptList');
        if (data.transcript && data.transcript.length > 0) {
          transcriptList.innerHTML = data.transcript.map(t => 
            `<div class="transcript-item">"${t}"</div>`
          ).join('');
          transcriptList.scrollTop = transcriptList.scrollHeight;
        }

        // Update speaker verification
        const similarity = data.speaker_similarity || 0;
        const percentage = Math.round(similarity * 100);
        document.getElementById('verificationFill').style.width = `${percentage}%`;
        document.getElementById('similarityValue').textContent = `${percentage}%`;
        
        const statusDot = document.getElementById('statusDot');
        const verificationStatus = document.getElementById('verificationStatus');
        
        if (data.is_verified) {
          verificationStatus.textContent = '✅ Verified';
          verificationStatus.style.color = 'var(--accent-success)';
          statusDot.classList.add('verified');
          statusDot.classList.remove('unverified');
        } else if (similarity > 0) {
          verificationStatus.textContent = '⚠️ Not verified';
          verificationStatus.style.color = 'var(--accent-warning)';
          statusDot.classList.add('unverified');
          statusDot.classList.remove('verified');
        } else {
          verificationStatus.textContent = 'Waiting...';
          verificationStatus.style.color = '';
        }

        // Update keywords
        if (data.keywords) {
          renderKeywords(data.keywords);
        }

        // Update last keyword
        const lastKeywordSection = document.getElementById('lastKeywordSection');
        const lastKeywordValue = document.getElementById('lastKeywordValue');
        if (data.last_keyword) {
          lastKeywordSection.style.display = 'block';
          lastKeywordValue.textContent = data.last_keyword.toUpperCase();
        }

      } catch (err) {
        console.error('Polling error:', err);
      }
    }
  </script>
</body>
</html>
